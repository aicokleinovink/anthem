<!-- The flag mark from the project logo: a banner with a wave through it, the top edge
     rising left to right and the bottom edge falling, so it reads as cloth in motion.
     This is the source the PNG icons are rasterised from — see frontend/scripts/render-icons.py.
     The glyph sits in the middle 62%; iOS masks its own corners, so none are drawn here. -->
