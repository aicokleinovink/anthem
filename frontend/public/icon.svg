  <rect width="100" height="100" fill="#1c1c22"/>
  <path fill="#f5f2ec" transform="translate(19 19) scale(0.62)"
        d="M0,15.1 C8,4 16,0 26,0 C40,0 52,15.7 72,15.7 C84,15.7 92,8 100,0
           L100,83.8 C92,91.8 84,99.5 72,99.5 C52,99.5 40,83.8 26,83.8
           C16,83.8 8,87.8 0,98.9 Z"/>
</svg>
