name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch is wasted work; cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A PR stacked on another branch can merge into *that branch* rather than into `main`,
  # which loses the change silently: the PR reads as merged, its `Closes #n` never fires
  # because closing keywords only register against the default branch, and nothing is red.
  # That happened to #21. Catch it while the PR is open, when it is still cheap to fix.
  base:
    name: base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Base branch must be main
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "::error::This PR targets '$BASE', not 'main'. Merging it would land the" \
                 "change on that branch and never on main. Retarget it:" \
                 "gh pr edit ${{ github.event.pull_request.number }} --base main"
            exit 1
          fi
          echo "Base is main."

  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run typecheck
        working-directory: api
      # The suite stubs the devices, so no hardware is needed here.
      - run: npm test
        working-directory: api
      - run: npm run build
        working-directory: api

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # `vite build` runs `tsc -b` first, so this typechecks and bundles in one step.
      - run: npm run build
        working-directory: frontend

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e

      # The browser download is the slow part; the OS libraries it needs are not cached.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      # Chromium only: one engine is enough for a self-hosted remote.
      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      # Builds the frontend and starts the app against fake devices — no hardware.
      - run: npm run e2e
        working-directory: e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
