name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch is wasted work; cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run typecheck
        working-directory: api
      # The suite stubs the devices, so no hardware is needed here.
      - run: npm test
        working-directory: api
      - run: npm run build
        working-directory: api

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # `vite build` runs `tsc -b` first, so this typechecks and bundles in one step.
      - run: npm run build
        working-directory: frontend
